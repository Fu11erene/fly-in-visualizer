# uv.lock で固定されたバージョンを使うため、すべて local フックで uv run 経由で実行する
# stages 未指定のフックはコミット時のみ実行する（pytest は push 時のみ）
default_stages: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: flake8
        name: flake8
        entry: uv run flake8
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: >-
          uv run mypy .
          --warn-return-any --warn-unused-ignores
          --ignore-missing-imports --disallow-untyped-defs
          --check-untyped-defs
        language: system
        pass_filenames: false
        types: [python]
      - id: pytest
        name: pytest
        entry: uv run pytest -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
